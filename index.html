<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gully Auction</title>
<style>
:root,:root[data-theme="scoreboard"]{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07120d;--card:#0e2118;--ink:#f4efe0;--mut:#8fa596;--line:#21402f;--acc:#ffb400;--acc2:#ffd24a;--bad:#ff5a4d;--onacc:#1a1200;--glow:#ffb40088;--stripe:#ffffff08}
@media (prefers-color-scheme:light){:root:not([data-theme]){--bg:#f3ecd9;--card:#fffaf0;--ink:#2a2118;--mut:#7a6a55;--line:#dccfb4;--acc:#8c1d2c;--acc2:#a9731a;--bad:#b91c1c;--onacc:#ffffff;--glow:#8c1d2c22;--stripe:#8c6a2a0d}}
:root[data-theme="pavilion"]{--bg:#f3ecd9;--card:#fffaf0;--ink:#2a2118;--mut:#7a6a55;--line:#dccfb4;--acc:#8c1d2c;--acc2:#a9731a;--bad:#b91c1c;--onacc:#ffffff;--glow:#8c1d2c22;--stripe:#8c6a2a0d}
:root[data-theme="floodlight"]{--bg:#05060f;--card:#0e1124;--ink:#eaf0ff;--mut:#8a93b8;--line:#252b52;--acc:#00e5ff;--acc2:#ff3df2;--bad:#ff6b6b;--onacc:#001418;--glow:#00e5ff99;--stripe:#00e5ff08}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) repeating-linear-gradient(90deg,transparent 0 70px,var(--stripe) 70px 140px);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font:900 22px/1 "Courier New",ui-monospace,monospace;margin:0;letter-spacing:2px;color:var(--acc);text-shadow:0 0 14px var(--glow)}h1 span{color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:14px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button.on,button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button.warn{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.card{background:var(--card);box-shadow:inset 0 0 0 1px var(--line),0 6px 18px #0004;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mut{color:var(--mut)}.big{font:800 40px/1 "Courier New",ui-monospace,monospace;color:var(--acc2);text-shadow:0 0 14px var(--glow)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.timer{font:800 28px "Courier New",ui-monospace,monospace;color:var(--acc);text-shadow:0 0 12px var(--glow)}.lowt{color:var(--bad)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal>div{background:var(--card);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
textarea{width:100%;min-height:200px;font:12px/1.4 ui-monospace,monospace}
.pl{cursor:pointer}.pl:hover{border-color:var(--acc)}
.av{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,var(--c),#000 130%);display:grid;place-items:center;font:900 44px "Courier New",monospace;color:#fff8;border:1px solid var(--line)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcw{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:16px}
.pn{font:900 clamp(24px,5vw,40px)/1.05 system-ui,sans-serif;margin:8px 0}
.st{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap}.st small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px}.st b{font-size:22px}
.ov{position:fixed;inset:0;background:#000c;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.ov canvas{position:absolute;inset:0;pointer-events:none}
.sold{position:relative;text-align:center;color:#fff;animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.sold h2{margin:10px 0 4px;font-size:28px}.sold .av{width:150px;margin:10px auto}
.stamp{font:900 clamp(44px,12vw,72px) "Courier New",monospace;color:var(--c);letter-spacing:4px;text-shadow:0 0 26px var(--c);transform:rotate(-5deg)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* Full-screen live auction control room */
body.auction-mode main{max-width:none;width:100%;padding:12px 18px 22px}
body.auction-mode #nav{margin-bottom:10px}
.auction-shell{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,.9fr);gap:14px;align-items:start;min-height:calc(100vh - 112px)}
.auction-main{min-width:0;display:grid;gap:12px}
.auction-topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.auction-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.auction-player .av{height:100%;min-height:300px;aspect-ratio:auto;font-size:58px}
.auction-player-info{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.auction-player-info .pn{font-size:clamp(30px,4vw,54px);margin:12px 0}
.auction-stats{display:grid;grid-template-columns:repeat(4,minmax(55px,1fr));gap:8px;max-width:560px}
.auction-stats>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px}
.auction-stats small{display:block;color:var(--mut);font-size:10px;letter-spacing:1px}
.auction-stats b{font-size:clamp(18px,2vw,26px)}
.auction-bidbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.auction-current-bid{font:900 clamp(34px,5vw,58px)/1 'Courier New',monospace;color:var(--acc2);text-shadow:0 0 16px var(--glow)}
.auction-timer{font:900 clamp(34px,4vw,48px)/1 'Courier New',monospace;color:var(--acc);text-align:right}
.auction-actions{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:14px}
button.bid-hero{background:var(--acc);color:var(--onacc);border:0;border-radius:13px;padding:17px 30px;font-size:clamp(18px,2vw,24px);font-weight:900;min-height:66px;flex:1;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 55%,#000),0 0 24px var(--glow)}
button.bid-hero:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--acc) 55%,#000)}
/* Square franchise paddle bid control */
.auction-actions{align-items:center;justify-content:flex-start;gap:14px}
button.bid-hero{flex:0 0 clamp(170px,22vw,230px);width:clamp(170px,22vw,230px);height:clamp(170px,22vw,230px);min-height:0;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:3px solid color-mix(in srgb,var(--paddle-color,var(--acc)) 72%,#fff);border-radius:22px;background:radial-gradient(circle at 50% 25%,color-mix(in srgb,var(--paddle-color,var(--acc)) 88%,#fff),var(--paddle-color,var(--acc)) 65%,color-mix(in srgb,var(--paddle-color,var(--acc)) 65%,#000));color:#fff;text-shadow:0 2px 5px #0009;box-shadow:0 7px 0 color-mix(in srgb,var(--paddle-color,var(--acc)) 55%,#000),0 0 28px color-mix(in srgb,var(--paddle-color,var(--acc)) 45%,transparent);white-space:normal}
.paddle-mark{width:88px;height:88px;border:3px solid #ffffffc9;border-radius:50%;display:grid;place-items:center;background:#0002;font:1000 30px/1 'Arial Black',system-ui,sans-serif;letter-spacing:-1px;box-shadow:inset 0 0 0 5px #ffffff25,0 4px 12px #0004}
.paddle-action{font-size:clamp(15px,1.5vw,19px);font-weight:1000;letter-spacing:1.2px;text-align:center}
.paddle-sub{font-size:11px;font-weight:800;letter-spacing:1.4px;opacity:.9;text-align:center}
button.bid-hero:disabled{opacity:.55;filter:grayscale(.45);box-shadow:none}
.auction-actions button:not(.bid-hero){min-height:54px;padding:12px 18px}
.auction-side{display:grid;gap:12px;position:sticky;top:10px;max-height:calc(100vh - 130px);overflow:auto;padding-right:2px}
.auction-side .card{margin:0}
.team-board{display:grid;gap:8px}
.team-mini{border:1px solid var(--line);border-left:4px solid var(--team);border-radius:10px;padding:10px;background:var(--bg)}
.team-mini.mine-team{box-shadow:inset 0 0 0 1px var(--acc)}
.team-mini.leading-team{background:color-mix(in srgb,var(--team) 13%,var(--bg))}
.team-mini-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.team-mini-name{font-weight:850;display:flex;align-items:center;gap:7px}
.team-mini-purse{font:800 18px 'Courier New',monospace;color:var(--acc2);white-space:nowrap}
.team-mini-meta{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}
.team-mini-picks{font-size:12px;color:var(--mut);line-height:1.5}
.team-mini-picks b{color:var(--ink)}
.auction-recent{display:grid;gap:8px}
.auction-recent-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:7px}
.auction-recent-row:last-child{border:0;padding-bottom:0}
.auction-empty{padding:30px;text-align:center}
.limit-warning{color:var(--bad);font-size:12px;font-weight:700;margin-top:7px}
@media(max-width:900px){body.auction-mode main{padding:10px}.auction-shell{grid-template-columns:1fr}.auction-side{position:static;max-height:none;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}
@media(max-width:560px){.auction-player{grid-template-columns:105px minmax(0,1fr);gap:12px;padding:12px}.auction-player .av{min-height:170px;font-size:32px}.auction-player-info .pn{font-size:25px}.auction-stats{grid-template-columns:repeat(2,minmax(55px,1fr))}.auction-bidbar{margin-top:10px}.auction-actions{display:grid;grid-template-columns:1fr 1fr}.auction-actions .bid-hero{grid-column:1/-1;justify-self:center;width: min(100%,210px);height:210px;flex-basis:210px}.auction-timer{font-size:32px}}

/* Teams tab: franchise cards split by role */
body.teams-mode main{max-width:1500px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:16px}
.tcard{border:1px solid var(--line);border-top:5px solid var(--team);border-radius:18px;padding:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--team) 14%,var(--card)),var(--card) 170px);box-shadow:0 8px 24px #0004}
.tcard.mine{box-shadow:0 0 0 2px var(--acc),0 8px 24px #0004}
.tcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tcard-name{font:900 28px/1.1 system-ui,sans-serif;display:flex;align-items:center;gap:10px}
.tcard-name .dot{width:16px;height:16px;background:var(--team);box-shadow:0 0 12px var(--team)}
.tcard-purse{text-align:right}.tcard-purse small{display:block;color:var(--mut);font-size:10px;letter-spacing:1.5px}
.tcard-purse b{font:900 30px/1 "Courier New",ui-monospace,monospace;color:var(--acc2);text-shadow:0 0 14px var(--glow)}
.pbar{height:7px;border-radius:99px;background:var(--bg);margin:12px 0;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--team),var(--acc2))}
.tstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tstats>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tstats small{display:block;color:var(--mut);font-size:10px;letter-spacing:1px}.tstats b{font-size:18px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rsec{background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--rc);border-radius:12px;padding:10px;min-height:150px}
.rsec-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.5px;margin-bottom:6px}
.rsec-empty{color:var(--mut);font-size:12px;padding:20px 6px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.prow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;border:1px solid transparent}
.prow:hover{background:var(--card);border-color:var(--line)}
.mav{flex:0 0 38px;width:38px}.mav .av{font-size:13px;border-radius:9px}
.prow-i{flex:1;min-width:0}.prow-i b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-t{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.prow-t .tag{font-size:10px;padding:1px 6px}
.tag.rt{color:var(--acc2);border-color:var(--acc2)}
.prow-p{font:800 14px "Courier New",ui-monospace,monospace;color:var(--acc2);white-space:nowrap}
.tcard-a{margin-top:14px}
@media(max-width:560px){.rsec{min-height:0}.rgrid{grid-template-columns:1fr}.tstats{grid-template-columns:repeat(2,1fr)}.tcard-name{font-size:22px}}
/* Players tab: one collapsible table per set */
.pset{padding:0;overflow:hidden}
.pset>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px}
.pset>summary::-webkit-details-marker{display:none}
.pset-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pset-t::before{content:'▸';color:var(--acc);display:inline-block;transition:transform .15s}
.pset[open]>summary .pset-t::before{transform:rotate(90deg)}
.pset-t b{font:900 18px "Courier New",ui-monospace,monospace;color:var(--acc)}
.pset .wrap{padding:0 14px 12px;border-top:1px solid var(--line)}
.tag.live{color:var(--bad);border-color:var(--bad)}
.pset table{table-layout:fixed;min-width:720px}
.pset td{overflow:hidden;text-overflow:ellipsis}
.pset th:nth-child(1){width:24%}.pset th:nth-child(2){width:8%}.pset th:nth-child(3){width:10%}.pset th:nth-child(4){width:7%}.pset th:nth-child(5){width:14%}.pset th:nth-child(6){width:6%}.pset th:nth-child(7){width:7%}.pset th:nth-child(8){width:7%}.pset th:nth-child(9){width:17%}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n).toFixed(2)+' Cr';
const SAMPLE={settings:{purse:100,timer:20,reset:8,inc:0.25,maxSquad:11},
teams:[["Royal Strikers","#2563eb"],["Gully Kings","#dc2626"],["Night Owls","#7c3aed"],["Sunrisers XI","#ea580c"],["Green Mambas","#16a34a"],["Street Titans","#0891b2"]].map((t,i)=>({id:"t"+i,name:t[0],color:t[1]})),
players:[["Arjun Rao","BAT",2],["Kabir Shah","BOWL",1.5],["Dev Malhotra","AR",2],["Rohan Iyer","WK",1.5],["Sameer Khan","BAT",1],["Vikram Nair","BOWL",1],["Aditya Verma","AR",1.5],["Nikhil Joshi","BAT",1],["Tarun Das","BOWL",0.5],["Yash Patel","WK",1],["Manav Singh","AR",1],["Harsh Menon","BOWL",0.5]].map((p,i)=>({id:"p"+i,name:p[0],role:p[1],base:p[2],stats:[{y:"Season 1",m:8+i%3,r:p[1]==="BOWL"?20+i*3:150+i*22,sr:p[1]==="BOWL"?95:128+i,w:p[1]==="BAT"||p[1]==="WK"?0:5+i%6,e:7+(i%5)/4},{y:"Season 2",m:9,r:p[1]==="BOWL"?30:180+i*15,sr:132,w:p[1]==="BAT"||p[1]==="WK"?0:6+i%4,e:7.6}]}))};
const FN=['Arjun','Kabir','Dev','Rohan','Sameer','Vikram','Aditya','Nikhil','Tarun','Yash'],LN=['Rao','Shah','Malhotra','Iyer','Khan','Nair','Verma','Joshi','Das','Patel','Menon','Singh'],RL=['BAT','BOWL','AR','WK','BAT','BOWL','AR','BAT','BOWL','AR'];
SAMPLE.settings={purse:100,timer:20,reset:8,inc:0.25,maxSquad:15};
SAMPLE.teams=[['CSK','#f5b800'],['MI','#1d4ed8'],['RCB','#dc2626'],['KKR','#6d28d9'],['DC','#2563eb'],['RR','#ec4899'],['PBKS','#e11d48'],['SRH','#f97316'],['LSG','#0ea5e9'],['GT','#1e3a8a']].map((t,i)=>({id:'t'+i,name:t[0],color:t[1]}));
SAMPLE.players=Array.from({length:200},(_,i)=>{const r=RL[i%10],b=r==='BOWL',w=r==='BAT'||r==='WK';return{id:'p'+i,name:FN[i%10]+' '+LN[(i*7)%12]+(i>=60?' '+'ABC'[Math.floor(i/60)-1]:''),role:r,base:[2,1.5,1,0.5][i%4],stats:[1,2].map(k=>({y:'Season '+k,m:9+(i+k)%5,r:b?15+(i*3+k*5)%30:w?220+((i*37+k*11)%260):120+((i*29+k*13)%200),sr:b?90:122+(i*5+k)%26,w:w?0:4+(i*3+k)%11,e:b?6.8+((i+k)%9)/5:7.5+((i+k)%7)/6}))}});
let db,D,room='',meta=null,uid=null,host=false,cfg=null,lot=null,sold={},owners={},tab='auction',fin='',loaded={c:0};
const S=()=>cfg&&cfg.settings||SAMPLE.settings;
const ply=id=>cfg&&cfg.players.find(p=>p.id===id);
function auctionSetName(p){
 const explicit=String(p.auctionSet||p.set||'').trim();
 // Marquee players (flag marquee:true, or a set name containing "marquee") form the opening set(s)
 if(p.marquee===true)return /marquee/i.test(explicit)?explicit:'Marquee Set';
 if(explicit)return explicit;
 const role=String(p.role||'OTHER').toUpperCase();
 const roleName=({BAT:'Batters',AR:'All-rounders',WK:'Wicketkeepers',BOWL:'Bowlers'})[role]||'Other players';
 const caps=p.caps||{};
 const hasCaps=Object.values(caps).some(v=>Number(v)>0);
 const isCapped=p.capped===true||hasCaps||Number(p.iplMatches||p.ipl||0)>0;
 return (isCapped?'Capped ':'Uncapped ')+roleName;
}
function shuffled(list){
 const a=[...list];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function isCappedPlayer(p){const caps=p.caps||{};return p.capped===true||Object.values(caps).some(v=>Number(v)>0)||Number(p.iplMatches||p.ipl||0)>0}
// Works out what a set is (marquee / capped / role) from its name (e.g. "BA1", "UAL2", "Capped Bowlers") or, failing that, from its players
function setMeta(name,members){
 const n=String(name||'').trim();
 const marquee=/marquee/i.test(n)||/^m\d+$/i.test(n)||members.some(p=>p.marquee===true);
 let capped,role;
 const code=n.match(/^(u?)(ba|al|ar|wk|fa|sp)\s*\d*$/i);
 if(code){capped=!code[1];role={ba:'BAT',al:'AR',ar:'AR',wk:'WK',fa:'BOWL',sp:'BOWL'}[code[2].toLowerCase()]}

  const lf=left(t.id),sp=spent(t.id),pct=Math.max(0,Math.min(100,lf/total*100));
  const adj=cfg.retentionAdjustments?Number(cfg.retentionAdjustments[t.id]||0):0;
  const known=ROLES.map(r=>r[0]),others=roster.filter(x=>!known.includes(x.p.role));
  const sections=ROLES.map(([k,label,ic])=>sec(k,label,ic,roster.filter(x=>x.p.role===k))).join('')+(others.length?sec('?','Others','👤',others):'');
  const btn=!o&&!me?`<button class="pri" onclick="claim('${t.id}')">Join this team</button>`:o&&o.uid===uid?`<button class="warn" onclick="release('${t.id}')">Leave</button>`:host&&o&&o.uid!==uid?`<button class="warn" onclick="release('${t.id}')">Remove owner</button>`:'';
  return `<div class="tcard ${isMine?'mine':''}" style="--team:${t.color}">
  <div class="tcard-h"><div><div class="tcard-name"><span class="dot"></span>${esc(t.name)}${isMine?' <span class="tag">YOU</span>':''}</div><div class="mut" style="margin-top:4px">${o?'Managed by <b>'+esc(o.name||'Player')+'</b>':'Unclaimed franchise'}</div></div><div class="tcard-purse"><small>PURSE LEFT</small><b>${fmt(lf)}</b></div></div>
  <div class="pbar"><i style="width:${pct}%"></i></div>
  <div class="tstats"><div><small>SQUAD</small><b>${roster.length}/${S().maxSquad}</b></div><div><small>OVERSEAS</small><b>✈ ${overseasCount(t.id)}/${overseasLimit()}</b></div><div><small>SPENT</small><b>${fmt(sp)}</b></div><div><small>RETAINED</small><b>${roster.filter(x=>x.s.retained).length}</b></div></div>
  ${adj?`<div class="mut" style="font-size:11px;margin:-4px 0 10px">Includes official retention-slab adjustment of ${fmt(adj)}</div>`:''}
  <div class="rgrid">${sections}</div>
  ${btn?`<div class="row tcard-a">${btn}</div>`:''}</div>`}).join('')+'</div>';
}
async function claim(id){
 if(!uid)return toast('Sign in to join a team.');
 const r=db.doc('owners/'+id),s=await r.get();
 if(s.exists)return toast('Someone just took that team.');
 await r.set({uid,name:myName()||'Player'});
}
const release=id=>db.doc('owners/'+id).delete();
const setOpen={};
const SET_ROLE=['Batters','Bowlers','All-rounders','Wicketkeepers','Others'];
function setLabel(name,m){
 if(m.marquee)return 'Marquee';
 const f=/^u?fa\d*$/i.test(name)?'Fast bowlers':/^u?sp\d*$/i.test(name)?'Spinners':SET_ROLE[m.rr];
 return (m.capped?'Capped ':'Uncapped ')+f;
}
function toggleAllSets(open){(cfg.players||[]).forEach(p=>{setOpen[auctionSetName(p)]=open});setOpen['__retained']=open;render(true)}
function rPlayers(v){
 const pool=cfg.players.filter(p=>!p.retained),ret=cfg.players.filter(p=>p.retained);
 const sets=buildAuctionOrder(pool).sets;
 const byId=new Map(pool.map(p=>[p.id,p]));
 const liveId=lot&&lot.status==='bidding'?lot.pid:null;
 const head='<tr><th>Player</th><th>Role</th><th>Base</th><th>OVR</th><th>Country</th><th>Age</th><th>IPL</th><th>T20I</th><th>Status</th></tr>';
 const row=p=>{const s=sold[p.id],t=s&&team(s.team);
  const st=liveId===p.id?'<span class="tag live">● LIVE</span>':s?(t?`<span class="dot" style="background:${t.color}"></span> ${esc(t.name)} ${fmt(s.price)}`:'Unsold'):'<span class="mut">Pending</span>';
  return `<tr class="pl" onclick="stats('${p.id}')"><td><b>${esc(p.name)}</b></td><td>${esc(p.role)}</td><td>${fmt(p.base)}</td><td><b>${ovr(p)}</b></td><td>${esc(p.country||'')}</td><td>${p.age||''}</td><td>${(p.caps||{}).ipl||0}</td><td>${(p.caps||{}).t20||0}</td><td>${st}</td></tr>`};
 const byOvr=(a,b)=>ovr(b)-ovr(a)||String(a.name).localeCompare(b.name);
 const sec=(key,title,label,list)=>{
  const done=list.filter(p=>sold[p.id]).length,live=list.some(p=>p.id===liveId);
  return `<details class="pset card" data-s="${esc(key)}" ontoggle="setOpen[this.dataset.s]=this.open" ${setOpen[key]!==false?'open':''}><summary><span class="pset-t"><b>${esc(title)}</b><span class="tag">${esc(label)}</span>${live?'<span class="tag live">● LIVE NOW</span>':''}</span><span class="mut">${done}/${list.length} done</span></summary><div class="wrap"><table>${head}${list.slice().sort(byOvr).map(row).join('')}</table></div></details>`};
 const all=cfg.players,nSold=all.filter(p=>sold[p.id]&&sold[p.id].team).length,nUns=all.filter(p=>sold[p.id]&&!sold[p.id].team).length;
 let h=`<div class="card row sp"><span class="mut">${sets.length} sets · ${all.length} players · ${nSold} sold · ${nUns} unsold · ${all.length-nSold-nUns} pending</span><span class="row"><button onclick="toggleAllSets(true)">Expand all</button><button onclick="toggleAllSets(false)">Collapse all</button></span></div>`;
 sets.forEach(st=>{const list=st.ids.map(id=>byId.get(id)).filter(Boolean);h+=sec(st.name,st.name,setLabel(st.name,setMeta(st.name,list)),list)});
 if(ret.length)h+=sec('__retained','Retained','IPL 2025 retentions',ret);
 v.innerHTML=h;
}
function capsModal(p){const k=p.caps;
 $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div><div class="row sp"><h2 style="margin:0">${esc(p.name)}</h2><button onclick="this.closest('.modal').remove()">✕</button></div>
 <div style="width:120px">${avatar(p)}</div><p class="mut"><span class="tag">${esc(p.role)}</span> ${esc(p.country||'')}${p.age?' · age '+p.age:''} · Base ${fmt(p.base)} · <b>OVR ${ovr(p)}</b></p>
 <p class="mut">${p.bat?'Bats '+esc(p.bat):''}${p.bowl?' · Bowls '+esc(p.bowl):''}${p.set?' · Set '+esc(p.set):''}</p>
 <div class="wrap"><table><tr><th>Format</th><th>Matches played</th></tr><tr><td>IPL</td><td>${k.ipl||0}</td></tr><tr><td>T20 internationals</td><td>${k.t20||0}</td></tr><tr><td>ODI</td><td>${k.odi||0}</td></tr><tr><td>Test</td><td>${k.test||0}</td></tr></table></div>
 <p class="mut" style="font-size:12px">OVR is based on match experience across formats and the base price.</p></div></div>`}
function career(p){const st=p.stats||[];const m=st.reduce((a,s)=>a+(+s.m||0),0),r=st.reduce((a,s)=>a+(+s.r||0),0),w=st.reduce((a,s)=>a+(+s.w||0),0);return{m,r,w,avg:m?(r/m).toFixed(1):'-'}}
function stats(id){
 const p=ply(id);if(!p)return;if(p.caps)return capsModal(p);const c=career(p);
 $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div><div class="row sp"><h2 style="margin:0">${esc(p.name)}</h2><button onclick="this.closest('.modal').remove()">✕</button></div>
 <p class="mut"><span class="tag">${esc(p.role)}</span> Base ${fmt(p.base)} · <b>OVR ${ovr(p)}</b> · ${c.m} matches · ${c.r} runs · ${c.w} wickets · ${c.avg} runs/match</p>
 <div class="wrap"><table><tr><th>Season</th><th>Mat</th><th>Runs</th><th>SR</th><th>Wkts</th><th>Econ</th></tr>${(p.stats||[]).map(s=>`<tr><td>${esc(s.y)}</td><td>${esc(s.m)}</td><td>${esc(s.r)}</td><td>${esc(s.sr)}</td><td>${esc(s.w)}</td><td>${esc(s.e)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No past data</td></tr>'}</table></div></div></div>`;
}
function rSetup(v){
 v.innerHTML=`<button onclick="tab='auction';render(true)" style="margin-bottom:12px">← Back to auction</button><div class="card"><b>Everything is editable here.</b> <span class="mut">Edit the JSON (settings, teams, players with per-season stats), then save. Only the host sees this tab.</span>
 <textarea id="js" spellcheck="false">${esc(JSON.stringify(cfg||SAMPLE,null,1))}</textarea>
 <div class="row" style="margin-top:8px"><button class="pri" onclick="saveCfg()">Save setup</button><button onclick="$('#js').value=JSON.stringify(SAMPLE,null,1)">Fill sample</button></div></div>
 <div class="card"><b>Import players (CSV)</b><div class="mut">One per line: name, role (BAT/BOWL/AR/WK), base, matches, runs, strike rate, wickets, economy</div>
 <textarea id="csv" style="min-height:90px" placeholder="Rahul, BAT, 1.5, 24, 610, 135, 0, 0"></textarea>
 <div class="row" style="margin-top:8px"><button onclick="importCsv()">Add to setup</button><button class="warn" onclick="importCsv(true)">Replace all players</button></div></div>
 <div class="card"><b>Danger zone</b><div class="row" style="margin-top:8px"><button class="warn" onclick="resetAuction()">Reset auction (keeps setup)</button></div></div>`;
}
function importCsv(rep){
 try{const c=JSON.parse($('#js').value);if(rep)c.players=[];
 $('#csv').value.split('\n').filter(l=>l.trim()&&!/^name\s*,/i.test(l.trim())).forEach((l,i)=>{const a=l.split(',').map(x=>x.trim());
  c.players.push({id:'p'+Date.now().toString(36)+i,name:a[0],role:(a[1]||'BAT').toUpperCase(),base:+a[2]||0.5,stats:[{y:'Career',m:+a[3]||0,r:+a[4]||0,sr:+a[5]||0,w:+a[6]||0,e:+a[7]||0}]})});
 $('#js').value=JSON.stringify(c,null,1);$('#csv').value=''}catch(e){toast('Fix the JSON first: '+esc(e.message))}
}
async function saveCfg(){
 try{const c=JSON.parse($('#js').value);if(!c.settings||!c.teams||!c.players)throw new Error('Needs settings, teams and players');
 if(c.settings.maxOverseas==null)c.settings.maxOverseas=8;
 const auctionPlan=buildAuctionOrder(c.players.filter(p=>!p.retained));c.auctionOrder=auctionPlan.order;c.auctionSets=auctionPlan.sets;
 await db.doc('cfg/main').set(c);toast('');alert('Saved')}catch(e){toast('Could not save: '+esc(e.message))}
}
async function resetAuction(){
 if(!confirm('Clear all sold players and the current lot?'))return;
 for(const k of Object.keys(sold))if(!sold[k].retained)await db.doc('sold/'+k).delete();
 await db.doc('live/lot').delete();
}
function ovr(p){if(p.caps){const k=p.caps,w=(k.ipl||0)+.7*(k.t20||0)+.3*(k.odi||0)+.3*(k.test||0);return Math.max(50,Math.min(95,Math.round(56+13*Math.log10(1+w)+(p.base||0)*2)))}const st=p.stats||[],n=st.length||1,c=career(p),m=c.m||1,sr=st.reduce((a,s)=>a+(+s.sr||0),0)/n,e=st.reduce((a,s)=>a+(+s.e||0),0)/n;
 const bat=55+c.r/m*.35+(sr-120)*.3,bowl=55+c.w/m*14-(e-8)*3;
 const v=p.role==='BOWL'?bowl:p.role==='AR'?(bat+bowl)/2+4:bat;return Math.max(50,Math.min(99,Math.round(v)))}
function xi(id){
 const s=Object.keys(sold).filter(k=>sold[k].team===id).map(ply).filter(Boolean).sort((a,b)=>ovr(b)-ovr(a));
 const x=[],wk=s.find(p=>p.role==='WK');if(wk)x.push(wk);s.forEach(p=>{if(x.length<Math.min(11,S().maxSquad)&&!x.includes(p))x.push(p)});
 const bw=p=>p.role==='BOWL'||p.role==='AR';
 while(x.filter(bw).length<Math.min(4,Math.floor(S().maxSquad/3))){const o=s.find(p=>bw(p)&&!x.includes(p)),w=[...x].reverse().find(p=>!bw(p)&&p!==wk);if(!o||!w)break;x[x.indexOf(w)]=o}
 return x}
function rResults(v){
 const rows=cfg.teams.map(t=>{const x=xi(t.id);return{t,x,tot:x.reduce((a,p)=>a+ovr(p),0)}}).sort((a,b)=>b.tot-a.tot);
 v.innerHTML='<div class="card mut">Each team’s best Playing XI (with a keeper and bowling cover) ranked by total OVR. Highest total wins.</div>'+rows.map((r,i)=>`<div class="card" style="border-left:5px solid ${r.t.color}"><div class="row sp"><b>${i===0&&r.x.length?'🏆 ':''}${i+1}. ${esc(r.t.name)}${owners[r.t.id]?' · '+esc(owners[r.t.id].name||''):''}</b><b>${r.tot} pts${r.x.length<Math.min(11,S().maxSquad)?' <span class="tag">XI incomplete</span>':''}</b></div><div class="mut">${r.x.map(p=>esc(p.name)+' '+ovr(p)).join(' · ')||'No players yet'}</div></div>`).join('')}
const RC={BAT:'#2563eb',BOWL:'#dc2626',AR:'#7c3aed',WK:'#059669'};
const ini=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function avatar(p){return `<div class="av" style="--c:${RC[p.role]||'#555'}"><span>${esc(ini(p.name))}</span><img src="${esc(p.photo||'photos/'+p.id+'.jpg')}" alt="" onerror="if(!this.dataset.t){this.dataset.t=1;this.src=this.src.replace('.jpg','.png')}else this.remove()"></div>`}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type,v){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const sfx={start:()=>{tone(440,0,.1,'square',.1);tone(660,.12,.2,'square',.1)},bid:()=>{tone(660,0,.12,'triangle',.2);tone(880,.08,.16,'triangle',.2)},tick:()=>tone(520,0,.08,'square',.08),
 sold:()=>{tone(110,0,.15,'square',.35);tone(110,.25,.2,'square',.4);[523,659,784,1047].forEach((f,i)=>tone(f,.55+i*.13,.35,'sawtooth',.14));tone(1047,1.1,.9,'triangle',.2);tone(1319,1.15,.9,'triangle',.15)},
 unsold:()=>{tone(300,0,.25,'sawtooth',.18);tone(220,.25,.45,'sawtooth',.18)}};
function toggleMute(){muted=!muted;try{localStorage.setItem('ga_mute',muted?'1':'0')}catch(e){}const m=$('#mu');if(m)m.textContent=muted?'\ud83d\udd07':'\ud83d\udd0a'}
document.addEventListener('click',()=>ac(),{once:true});
function react(o,n){
 if(!seen){seen=true;return}
 if(!n)return;
 if(n.status==='bidding'){if(!o||o.pid!==n.pid||o.status!=='bidding')sfx.start();else if(n.bid!==o.bid)sfx.bid()}
 else if(n.status==='done'&&o&&o.status==='bidding'&&o.pid===n.pid)celebrate(n)
}
function celebrate(n){
 const p=ply(n.pid),t=team(n.team);if(!p)return;
 const ov=document.createElement('div');ov.className='ov';ov.style.setProperty('--c',t?t.color:'#888');
 ov.innerHTML=`<canvas></canvas><div class="sold"><div class="stamp">${t?'SOLD!':'UNSOLD'}</div>${avatar(p)}<h2>${esc(p.name)}</h2>${t?`<div>to <b style="color:${t.color}">${esc(t.name)}</b></div><div class="big">${fmt(n.bid)}</div>`:'<div class="mut">No bids</div>'}</div>`;
 document.body.appendChild(ov);
 if(t){sfx.sold();confetti(ov.querySelector('canvas'),t.color)}else sfx.unsold();
 const done=()=>ov.remove();ov.onclick=done;setTimeout(done,t?4500:2200);
}
function confetti(c,col){
 const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=[col,'#ffd24a','#ffffff','#ff4d1a','#2dd4bf'];
 const P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
 let f=0;(function d(){if(!c.isConnected)return;x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<270)requestAnimationFrame(d)})()
}
init();
</script></body></html>
